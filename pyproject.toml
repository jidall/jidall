[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assistente-de-provas"
version = "1.0.1"
description = "Desktop assistant for generating assessment documents"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7",
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "keyring>=25.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
assistente-de-provas = "app.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
